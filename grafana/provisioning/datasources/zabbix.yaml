apiVersion: 1
datasources:
  - name: Zabbix
    uid: zabbix-lab
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    isDefault: true
    editable: true
    jsonData:
      authType: userLogin
      username: grafana
      trends: true
      trendsFrom: 7d
      trendsRange: 4d
      cacheTTL: 1m
      timeout: 30
    secureJsonData:
      password: $LAB_ZBX_GRAFANA_PASSWORD
